<!doctype html><html lang="ko"><meta charset="utf-8"><title>TokenLab 압축 검수</title>
<style>body{font:15px system-ui;margin:20px;background:#fafafa;color:#172338}button,select,input{padding:7px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border:1px solid #ccd;max-height:65vh;overflow:auto} .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}fieldset{margin:12px 0}textarea{width:95%;height:60px}mark{background:#ffe279}summary{cursor:pointer} label{display:inline-block}#status{color:#125c35}</style>
<h1>TokenLab 압축 실패 검수</h1><p>자동 위치 후보는 미확인입니다. 정확 일치 실패는 근거 삭제 판정이 아닙니다. 근거는 문항 수준이며 key_fact별 대응을 추정하지 않습니다. 실패 선택 표본으로 전체 원인 발생률을 추정하지 마세요.</p>
<p>A: 근거 삭제 · B: 관계/조건 손상 · C: 근거 충분하나 답변 실패 · D: judge/정답 문제. 각 사실의 복합 원인은 독립 항목으로 기록하세요.</p>
<select id="case"></select><button id="prev">이전</button><button id="next">다음</button><button id="save">입력 판정 CSV 다운로드</button><button id="backup">판정 JSON 백업</button><label>백업 불러오기<input type="file" id="restore" accept="application/json"></label><span id="status"></span>
<details><summary>분모·실행 메타데이터·누락 보고</summary><pre id="meta"></pre></details>
<h2 id="heading"></h2><pre id="question"></pre><div class="pair"><pre id="baseline"></pre><pre id="answer"></pre></div>
<div id="facts"></div><h2>근거 구절 및 위치</h2><div id="evidence"></div>
<label>양쪽 문맥 검색<input id="search" placeholder="문자열 입력"></label><button id="find">검색/강조</button><span id="matches"></span>
<div class="pair"><section><h2>원본 전체 문맥</h2><pre id="original"></pre></section><section><h2>압축 전체 문맥</h2><pre id="compressed"></pre></section></div>
<script id="data" type="application/json">__PAYLOAD__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const labels=['evidence_deleted','relation_damaged','evidence_sufficient','judge_or_gold_issue','primary_cause','confidence','memo'];
const key='tokenlab-review-'+data.metadata.inputs.find(x=>x.path===data.metadata.test.path+'/trials.jsonl').sha256;
let human={};try{human=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify(human));$('status').textContent='브라우저에 저장됨 (CSV/JSON 백업 권장)'}catch(e){$('status').textContent='브라우저 저장 불가: CSV/JSON을 다운로드하세요'}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
$('save').onclick=()=>{const rows=data.review_rows.filter(r=>labels.some(k=>(human[r.review_id]||{})[k]));const fields=Object.keys(data.review_rows[0]||{});download('human_review.csv',[fields.map(csvCell).join(','),...rows.map(r=>fields.map(k=>csvCell(labels.includes(k)?(human[r.review_id]||{})[k]||'':r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};
$('backup').onclick=()=>download('human_review_backup.json',JSON.stringify({key,human},null,2),'application/json');
$('restore').onchange=async e=>{try{const x=JSON.parse((await e.target.files[0].text()).replace(/^\ufeff/,''));if(x.key!==key)throw Error('다른 run의 백업');const ids=new Set(data.review_rows.map(r=>r.review_id));for(const [id,v] of Object.entries(x.human)){if(!ids.has(id)||!v||typeof v!=='object')throw Error('잘못된 review_id');for(const [k,value] of Object.entries(v)){if(!labels.includes(k)||typeof value!=='string')throw Error('잘못된 필드')}}human=x.human;persist();render()}catch(err){alert(err.message)}};
$('meta').textContent=JSON.stringify(data.metadata,null,2);
data.records.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${r.cohort} | ${r.qid} | ${r.type} | ${r.compressor}`;$('case').append(o)});
function showContext(id,text,needle){const el=$(id);el.replaceChildren();if(text===null){el.textContent='[문맥 파일 누락]';return 0}if(!needle){el.textContent=text;return 0}let start=0,pos,count=0;while((pos=text.toLowerCase().indexOf(needle.toLowerCase(),start))>=0){el.append(document.createTextNode(text.slice(start,pos)));const mark=document.createElement('mark');mark.textContent=text.slice(pos,pos+needle.length);el.append(mark);start=pos+needle.length;count++}el.append(document.createTextNode(text.slice(start)));el.querySelector('mark')?.scrollIntoView({block:'nearest'});return count}
function contexts(){const r=data.records[+$('case').value];$('matches').textContent=`원본 ${showContext('original',r.original_context,$('search').value)} / 압축 ${showContext('compressed',r.compressed_context,$('search').value)}`}
function render(){const r=data.records[+$('case').value];if(!r)return;$('heading').textContent=r.trial_id;$('question').textContent=JSON.stringify({question:r.dataset_item.question,answer:r.dataset_item.answer,join_errors:r.join_errors},null,2);
for(const [id,t]of [['baseline',r.none_trial],['answer',r.compressed_trial]])$(id).textContent=`${t.compressor}\naccuracy: ${t.answer_accuracy} | NOT FOUND: ${t.not_found}\ncontext tokens: ${t.context_tokens}/${t.context_tokens_raw} | reduction_pct: ${t.reduction_pct}\ninput reduction_pct: ${t.input_reduction_pct}\n\n${t.response}\n\njudge facts: ${JSON.stringify(t.fact_results)}`;
$('facts').replaceChildren();for(const row of data.review_rows.filter(x=>x.trial_id===r.trial_id)){const f=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=`fact ${row.fact_index}: ${row.key_fact??'[누락]'} — 자동: unverified`;f.append(legend);for(const name of labels){const l=document.createElement('label');l.textContent=name;let input;if(name==='memo'){input=document.createElement('textarea')}else{input=document.createElement('select');let opts=name==='primary_cause'?['','A','B','C','D','uncertain']:name==='confidence'?['','low','medium','high']:['','yes','no','uncertain'];for(const v of opts){const o=document.createElement('option');o.value=v;o.textContent=v||'미입력';input.append(o)}}input.value=(human[row.review_id]||{})[name]||'';input.onchange=()=>{human[row.review_id]||={};if(input.value)human[row.review_id][name]=input.value;else delete human[row.review_id][name];persist()};l.append(input);f.append(l)}$('facts').append(f)}
$('evidence').replaceChildren();for(const e of r.evidence){const pre=document.createElement('pre');pre.textContent=JSON.stringify(e,null,2);const b=document.createElement('button');b.textContent='정확 구절 검색';b.onclick=()=>{$('search').value=e.quote;contexts()};const jump=document.createElement('button');jump.textContent='미확인 유사 구간으로 이동';jump.onclick=()=>{for(const [id,loc]of [['original',e.original_location],['compressed',e.compressed_location]]){const el=$(id),text=id==='original'?r.original_context:r.compressed_context;showContext(id,text,'');const offset=loc.exact_offsets?.[0]??loc.candidate_offset;if(offset!==undefined&&text){el.replaceChildren(document.createTextNode(text.slice(0,offset)));const mark=document.createElement('mark');mark.textContent=text.slice(offset,offset+Math.max(1,e.quote.length));el.append(mark,document.createTextNode(text.slice(offset+Math.max(1,e.quote.length))));mark.scrollIntoView({block:'nearest'})}}};$('evidence').append(pre,b,jump)}contexts()}
$('case').onchange=render;$('prev').onclick=()=>{$('case').selectedIndex=Math.max(0,$('case').selectedIndex-1);render()};$('next').onclick=()=>{$('case').selectedIndex=Math.min(data.records.length-1,$('case').selectedIndex+1);render()};$('find').onclick=contexts;render();
</script></html>
